[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-llm-reversible-router"
version = "0.1.0"
description = "Reversible typed-pseudonymization & complexity-aware Hybrid LLM Router (Local Gate + Fast SLM + Cloud Frontier)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "peco" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
